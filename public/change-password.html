<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DigitalBank ETB — Change Password" />
  <title>DigitalBank ETB — Change Password</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body class="change-password-page">

  <div class="change-password-card">
    <!-- Header -->
    <h2>Change Your Password</h2>
    <p class="policy-hint">
      Password requirements: minimum 12 characters, at least one uppercase letter,
      one lowercase letter, one digit, and one special character (e.g. !@#$%^&amp;*).
    </p>

    <!-- Global error -->
    <div id="form-error" class="alert alert--error hidden" role="alert" aria-live="polite"></div>
    <!-- Global success -->
    <div id="form-success" class="alert alert--success hidden" role="status" aria-live="polite"></div>

    <!-- Change Password Form -->
    <form id="change-password-form" novalidate>

      <!-- Current Password -->
      <div class="form-group">
        <label for="current-password">Current Password</label>
        <div class="input-password-wrap">
          <input
            type="password"
            id="current-password"
            name="current-password"
            class="form-control"
            placeholder="Enter your current password"
            autocomplete="current-password"
            required
            aria-describedby="current-password-error"
          />
          <button
            type="button"
            class="btn-toggle-pw"
            data-target="current-password"
            aria-label="Toggle current password visibility"
            aria-pressed="false"
          >👁</button>
        </div>
        <span id="current-password-error" class="field-error" role="alert" aria-live="polite"></span>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="new-password">New Password</label>
        <div class="input-password-wrap">
          <input
            type="password"
            id="new-password"
            name="new-password"
            class="form-control"
            placeholder="At least 12 characters"
            autocomplete="new-password"
            required
            aria-describedby="new-password-error new-password-hint"
          />
          <button
            type="button"
            class="btn-toggle-pw"
            data-target="new-password"
            aria-label="Toggle new password visibility"
            aria-pressed="false"
          >👁</button>
        </div>
        <span id="new-password-hint" class="field-hint">
          Min 12 chars · uppercase · lowercase · digit · special char
        </span>
        <span id="new-password-error" class="field-error" role="alert" aria-live="polite"></span>
      </div>

      <!-- Confirm New Password -->
      <div class="form-group">
        <label for="confirm-password">Confirm New Password</label>
        <div class="input-password-wrap">
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            class="form-control"
            placeholder="Repeat your new password"
            autocomplete="new-password"
            required
            aria-describedby="confirm-password-error"
          />
          <button
            type="button"
            class="btn-toggle-pw"
            data-target="confirm-password"
            aria-label="Toggle confirm password visibility"
            aria-pressed="false"
          >👁</button>
        </div>
        <span id="confirm-password-error" class="field-error" role="alert" aria-live="polite"></span>
      </div>

      <!-- Submit -->
      <div class="form-group" style="margin-top: 8px;">
        <button type="submit" id="change-password-btn" class="btn btn--primary btn--full">
          <span>Update Password</span>
        </button>
      </div>
    </form>

    <!-- Back link -->
    <p style="text-align:center; margin-top: 20px; font-size: var(--font-size-sm);">
      <a href="/dashboard.html" aria-label="Return to dashboard">← Back to Dashboard</a>
    </p>
  </div>

  <!-- Toast Container -->
  <div
    id="toast-container"
    class="toast-container"
    role="region"
    aria-label="Notifications"
    aria-live="polite"
    aria-atomic="false"
  ></div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
